labels:
  backend: local

when:
  - event: manual
  - event: push
  - event: cron

steps:
  - name: check pinned
    image: bash
    depends_on: []
    commands:
      - nix run .#check-all-packages

  - name: check 26.05
    image: bash
    depends_on: []
    commands:
      - nix run .#check-all-packages -- --override-input nixpkgs github:nixos/nixpkgs/nixos-26.05
    failure: ignore

  - name: check unstable
    image: bash
    depends_on: []
    commands:
      - nix run .#check-all-packages -- --override-input nixpkgs github:nixos/nixpkgs/nixos-unstable
    failure: ignore
